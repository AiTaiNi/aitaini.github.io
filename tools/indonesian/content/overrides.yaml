# Hand corrections for build_indonesian.py (public: hand-written). Applied after everything is read from the sources.
#
# gloss:  a clearer card meaning than the dictionary's first sense, for very common words
# roots:  fix a word's root; null = show no root (etymology too remote to help a learner, or wrong)
# skip:   never put in the deck (names that are frequent in subtitles, and dictionary oddities)

skip: [sarah, athan, john, tom, mary, jack, michael, david, james, frank, peter, paul, mike, george, harry, charlie, sam, max, ben, alex, jim, joe, ray, nick, kate, anna, emma, lucy, jane, rose, tony, danny, eddie, billy, bobby, henry, walter, simon, carl, dean, lisa, amy, ryan, kevin, steve, chris, mark, adam, jason, eric]

