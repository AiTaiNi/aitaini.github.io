# Casual, chat and streaming Indonesian, hand-written for build_indonesian.py (public: no copied material).
# Merged with the slang Wiktionary already has. Entries with `deck: true` are mixed into the learning deck early
# (one every 10 words), in this order, so the most useful come first.
#
#   form:  as written casually (alternatives in `also`)
#   std:   standard/formal equivalent, if there is one
#   en:    English meaning
#   kind:  pronoun | negation | aspect | particle | casual | slang | abbrev | laugh | address | stream
#   note:  usage, shown on the card and the Slang page

- {form: gue, also: [gw, gua], std: saya, en: "I, me (Jakarta casual)", kind: pronoun, deck: true, note: "With friends and online; pairs with lu. Can sound rude to strangers."}
- {form: lu, also: [lo, loe, elu], std: kamu, en: "you (Jakarta casual)", kind: pronoun, deck: true, note: "Pairs with gue."}
- {form: aku, also: [ak, aq], std: saya, en: "I, me (casual, warm)", kind: pronoun, deck: true, note: "Softer than gue; common with friends, family and fans."}
- {form: kamu, also: [km, kmu], en: "you (casual)", kind: pronoun, deck: true}
- {form: kalian, en: "you all", kind: pronoun, deck: true, note: "Streamers use it for their chat: 'makasih ya kalian'."}
